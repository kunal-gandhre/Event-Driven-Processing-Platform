apiVersion: apps/v1kind: Deploymentmetadata: { name: event-platform, namespace: event-platform }spec:  replicas: 2  selector: { matchLabels: { app: event-platform } }  template:    metadata: { labels: { app: event-platform } }    spec:      containers:        - name: app          image: event-driven-processing-platform:local          imagePullPolicy: IfNotPresent          ports: [{ containerPort: 8080 }]          envFrom: [{ configMapRef: { name: event-platform-config } }, { secretRef: { name: event-platform-secrets } }]          readinessProbe: { httpGet: { path: /actuator/health, port: 8080 }, initialDelaySeconds: 15 }          livenessProbe: { httpGet: { path: /actuator/health, port: 8080 }, initialDelaySeconds: 30 }          resources: { requests: { cpu: 200m, memory: 512Mi }, limits: { cpu: "1", memory: 1Gi } }